name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-check:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r frontend/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 frontend/ \
            --max-line-length=120 \
            --ignore=E501,W503,E302,E303 \
            --exclude=frontend/__pycache__

  build-backend:
    name: Build C++ Backend (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'backend/vcpkg.json'

      - name: Configure CMake
        run: |
          cmake -B backend/build -S backend `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build backend/build --config Release

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: code-quest-backend-windows
          path: backend/build/Release/code_quest_backend.exe
